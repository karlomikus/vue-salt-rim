tcp_nopush on;
tcp_nodelay on;

access_log off;
error_log stderr error;

client_max_body_size 100M;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /var/www/html/;

    # The service worker script must always be revalidated so updates are found
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # The app shell points at the current asset hashes, it must never be stale
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Runtime config is generated from environment variables and can change
    # without a new build, never cache it
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Vite emits content-hashed asset filenames
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Workbox runtime is content-hashed as well
    location ~ ^/workbox-.*\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
